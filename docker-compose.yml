# [FamilyTree 專案 - Docker Compose 組態檔]
#
# 此檔案定義了 FamilyTree 專案的多容器應用程式設定。
# 它同時用於本地開發環境和在 AWS EC2 上的部署。
#
# 若要啟動所有服務，請執行：
#   docker-compose up -d --build
#
# 若要停止所有服務，請執行：
#   docker-compose down
#
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: familytree
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database-backup:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - familytree-network

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - "start"
      - "--all"
      - "--config"
      - "/etc/ngrok.yml"
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml
    ports:
      - "4040:4040"
    networks:
      - familytree-network

  familytree-backend:
    build: ./familytree-backend
    ports:
      - "5088:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=familytree;Username=user;Password=password123
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - familytree-network

  familytree-frontend:
    build: ./familytree-frontend
    ports:
      - "4200:80"
    depends_on:
      - familytree-backend
    restart: unless-stopped
    networks:
      - familytree-network

volumes:
  postgres_data:

networks:
  familytree-network:
    driver: bridge 