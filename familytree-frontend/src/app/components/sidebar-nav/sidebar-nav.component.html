<!-- 漢堡選單按鈕 -->
<div class="hamburger-menu" (click)="toggleSidebar()">
  <div class="hamburger-icon" [class.active]="isSidebarOpen">
    <span></span>
    <span></span>
    <span></span>
  </div>
</div>

<!-- 手機版遮罩 -->
<div class="sidebar-overlay" 
     [class.active]="isSidebarOpen" 
     (click)="closeSidebar()">
</div>

<!-- 側邊欄 -->
<div class="sidebar-nav" [class.mobile-open]="isSidebarOpen">
  <div class="nav-header">
    <h3>
      <a routerLink="/" class="sidebar-title-link" (click)="closeSidebar()">🧬 視覺化分析系統</a>
    </h3>
    <!-- 手機版關閉按鈕 -->
    <button class="close-btn" (click)="closeSidebar()">×</button>
  </div>

  <!-- 當前專案信息 -->
  <div class="current-project-info" *ngIf="getCurrentProject()">
    <div class="project-name">
      <span class="project-icon">📁</span>
      <span class="project-title">{{ getCurrentProject()?.projectName }}</span>
    </div>
    <button class="change-project-btn" (click)="switchProject()" title="切換專案">
      🔄
    </button>
  </div>
  
  <nav class="nav-menu">
    <!-- 案件管理 -->
    <div class="nav-section">
      <h4>📋 案件管理</h4>
      <ul class="nav-list">
        <li class="nav-item" [class.active]="activeRoute === 'file-upload'">
          <a routerLink="/file-upload" (click)="closeSidebar()">
            <span class="nav-icon">📤</span>
            <span class="nav-text">檔案上傳</span>
          </a>
        </li>
        <li class="nav-item" [class.active]="activeRoute === 'person-list'">
          <a routerLink="/person-list" (click)="closeSidebar()">
            <span class="nav-icon">📋</span>
            <span class="nav-text">人員列表</span>
          </a>
        </li>
      </ul>
    </div>
    
    <!-- 視覺化分析 -->
    <div class="nav-section">
      <h4>📊 視覺化分析</h4>
      <ul class="nav-list">
        <li class="nav-item" [class.active]="activeRoute === 'full-text-search'">
          <a routerLink="/full-text-search" (click)="closeSidebar()">
            <span class="nav-icon">🔍</span>
            <span class="nav-text">全文檢索</span>
          </a>
        </li>
        <li class="nav-item" [class.active]="activeRoute === 'relationship-graph'">
          <a routerLink="/relationship-graph" (click)="closeSidebar()">
            <span class="nav-icon">📊</span>
            <span class="nav-text">關係圖譜</span>
          </a>
        </li>
        <li class="nav-item" [class.active]="activeRoute === 'organization-chart'">
          <a routerLink="/organization-chart" (click)="closeSidebar()">
            <span class="nav-icon">🏢</span>
            <span class="nav-text">組織圖</span>
          </a>
        </li>
      </ul>
    </div>
    
    <!-- 系統管理 -->
    <div class="nav-section">
      <h4>⚙️ 系統管理</h4>
      <ul class="nav-list">
        <li class="nav-item" [class.active]="activeRoute === 'system-settings'">
          <a routerLink="/system-settings" (click)="closeSidebar()">
            <span class="nav-icon">⚙️</span>
            <span class="nav-text">系統設定</span>
          </a>
        </li>
      </ul>
    </div>
  </nav>
</div>
