<!-- 漢堡選單按鈕 -->
<button class="hamburger" (click)="toggleSidebar()" [attr.aria-expanded]="isSidebarOpen" aria-label="切換導航選單">
  <div class="hamburger__icon" [class.is-active]="isSidebarOpen">
    <span class="hamburger__line"></span>
    <span class="hamburger__line"></span>
    <span class="hamburger__line"></span>
  </div>
</button>

<!-- 手機版遮罩 -->
<div class="sidebar__overlay" 
     [class.is-active]="isSidebarOpen" 
     (click)="closeSidebar()"
     [attr.aria-hidden]="!isSidebarOpen">
</div>

<!-- 側邊欄 - 根據 Figma 設計重構 -->
<aside class="sidebar" [class.sidebar--mobile-open]="isSidebarOpen">
  <!-- 側邊欄頂部 - 收起按鈕 -->
  <div class="sidebar__header">
    <button class="sidebar__collapse-btn" (click)="toggleSidebar()" aria-label="收起側邊欄">
      <img src="/assets/icons/circle-left.png" alt="" class="sidebar__collapse-icon">
    </button>
    <!-- 手機版關閉按鈕 -->
    <button class="sidebar__close-btn" (click)="closeSidebar()" aria-label="關閉側邊欄">×</button>
  </div>

  <!-- 主要導航選單 -->
  <nav class="sidebar__nav" role="navigation" aria-label="主要導航">
    <!-- 導航項目列表 -->
    <ul class="nav__list">
      <!-- 關鍵字檢索 -->
      <li class="nav__item" [class.is-active]="activeRoute === 'full-text-search'">
        <a class="nav__link" routerLink="/full-text-search" (click)="closeSidebar()" [attr.aria-current]="activeRoute === 'full-text-search' ? 'page' : null">
          <div class="nav__icon">
            <img src="/assets/icons/magnifying-glass-chart.png" alt="" class="nav__icon-img">
          </div>
          <span class="nav__text">關鍵字檢索</span>
        </a>
      </li>
      
      <!-- 視覺化分析 -->
      <li class="nav__item" [class.is-active]="activeRoute === 'visual-analysis'">
        <a class="nav__link" routerLink="/visual-analysis" (click)="closeSidebar()" [attr.aria-current]="activeRoute === 'visual-analysis' ? 'page' : null">
          <div class="nav__icon">
            <img src="/assets/icons/chart-pie.png" alt="" class="nav__icon-img">
          </div>
          <span class="nav__text">視覺化分析</span>
        </a>
      </li>
      
      <!-- 案件管理 -->
      <li class="nav__item" [class.is-active]="activeRoute === 'case-management'">
        <a class="nav__link" routerLink="/case-management" (click)="closeSidebar()" [attr.aria-current]="activeRoute === 'case-management' ? 'page' : null">
          <div class="nav__icon">
            <img src="/assets/icons/folder-open.png" alt="" class="nav__icon-img">
          </div>
          <span class="nav__text">案件管理</span>
        </a>
      </li>
      
      <!-- 系統管理 (只有管理員可見) -->
      <li class="nav__item" [class.is-active]="isSystemManagementActive()" *ngIf="isAdmin">
        <a class="nav__link" routerLink="/user-management" (click)="closeSidebar()" [attr.aria-current]="isSystemManagementActive() ? 'page' : null">
          <div class="nav__icon">
            <img src="/assets/icons/gear.png" alt="" class="nav__icon-img">
          </div>
          <span class="nav__text">系統管理</span>
        </a>
      </li>
    </ul>
  </nav>
  
  <!-- 使用者資訊區域 -->
  <div class="sidebar__user" *ngIf="currentUser">
    <div class="user-info">
      <div class="user-info__name">{{ currentUser.fullName || currentUser.username }}</div>
      <div class="user-info__role">{{ currentUser.role === 'admin' ? '管理員' : '一般使用者' }}</div>
    </div>
    <button class="logout-btn" (click)="logout()" title="登出">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <path d="M7.5 17.5H4.16667C3.72464 17.5 3.30072 17.3244 2.98816 17.0118C2.67559 16.6993 2.5 16.2754 2.5 15.8333V4.16667C2.5 3.72464 2.67559 3.30072 2.98816 2.98816C3.30072 2.67559 3.72464 2.5 4.16667 2.5H7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M13.3333 14.1667L17.5 10L13.3333 5.83334" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M17.5 10H7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <!-- 背景裝飾 -->
  <div class="sidebar__background" aria-hidden="true"></div>
</aside>
