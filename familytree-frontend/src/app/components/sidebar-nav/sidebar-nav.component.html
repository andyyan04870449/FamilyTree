<!-- 漢堡選單按鈕 -->
<div class="hamburger-menu" (click)="toggleSidebar()">
  <div class="hamburger-icon" [class.active]="isSidebarOpen">
    <span></span>
    <span></span>
    <span></span>
  </div>
</div>

<!-- 手機版遮罩 -->
<div class="sidebar-overlay" 
     [class.active]="isSidebarOpen" 
     (click)="closeSidebar()">
</div>

<!-- 側邊欄 -->
<div class="sidebar-nav" [class.mobile-open]="isSidebarOpen">
  <div class="nav-header">
    <!-- 手機版關閉按鈕 -->
    <button class="close-btn" (click)="closeSidebar()">×</button>
  </div>

  
  <nav class="nav-menu">

    <!-- 1. 案件管理 -->
    <div class="nav-section">
      <ul class="nav-list">
        <li class="nav-item" [class.active]="activeRoute === 'case-management'">
          <a routerLink="/case-management" (click)="closeSidebar()">
            <span class="nav-icon">📋</span>
            <span class="nav-text">案件管理</span>
          </a>
        </li>
      </ul>
    </div>

    
    <!-- 2. 關鍵字檢索 -->
    <div class="nav-section">
      <ul class="nav-list">
        <li class="nav-item" [class.active]="activeRoute === 'full-text-search'">
          <a routerLink="/full-text-search" (click)="closeSidebar()">
            <span class="nav-icon">🔍</span>
            <span class="nav-text">關鍵字檢索</span>
          </a>
        </li>
      </ul>
    </div>
    
    <!-- 3. 視覺化分析 -->
    <div class="nav-section">
      <ul class="nav-list">
        <li class="nav-item" [class.active]="activeRoute === 'visual-analysis'">
          <a routerLink="/visual-analysis" (click)="closeSidebar()">
            <span class="nav-icon">📊</span>
            <span class="nav-text">視覺化分析</span>
          </a>
        </li>
      </ul>
    </div>
    
    <!-- 4. 系統設定 -->
    <div class="nav-section">
      <ul class="nav-list">
        <li class="nav-item" [class.active]="activeRoute === 'system-settings'">
          <a routerLink="/system-settings" (click)="closeSidebar()">
            <span class="nav-icon">⚙️</span>
            <span class="nav-text">系統設定</span>
          </a>
        </li>
      </ul>
    </div>
  </nav>
</div>
