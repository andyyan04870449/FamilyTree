<div class="visual-analysis-editor" *ngIf="!loading">
  <!-- 主要內容區域 -->
  <main class="editor-content" role="main">
    <!-- 左側搜尋面板 -->
    <aside class="search-panel" [class.show]="showSearchPanel" role="complementary" aria-label="搜尋面板">
      <header class="search-header">
        <button class="close-btn" (click)="toggleSearchPanel()" aria-label="關閉搜尋面板">×</button>
        <h3>查詢</h3>
      </header>
      
      <section class="search-content" aria-label="搜尋內容">
        <!-- 搜尋輸入框 -->
        <form class="search-input-group" role="search">
          <input 
            type="text" 
            placeholder="請輸入關鍵字" 
            class="search-input"
            [(ngModel)]="searchKeyword"
            aria-label="搜尋關鍵字">
          <button class="search-submit-btn" type="submit" aria-label="搜尋">🔍</button>
        </form>
        
        <!-- 全選選項 -->
        <div class="select-all-option">
          <label class="checkbox-label">
            <input type="checkbox" (change)="toggleAllNodes($event)">
            <span>全選</span>
          </label>
        </div>
        
        <!-- 專案樹狀結構 -->
        <app-project-tree
          [projects]="getProjectTreeData()"
          (personVisibilityChanged)="onProjectTreeVisibilityChange($event)"
        ></app-project-tree>
      </section>
    </aside>

    <!-- 右側圖譜畫布 - 直接使用關係圖譜組件 -->
    <section class="graph-canvas-container" aria-label="關係圖譜畫布">
      <!-- 關係圖譜組件 -->
      <div class="canvas-wrapper">
        <app-relationship-graph
          *ngIf="graphData"
          [graphData]="graphData"
          [autoAnalyze]="false"
          [visualAnalysisGraphId]="graphId"
          (relationshipCreated)="onRelationshipCreated()"
          (onShowAllNodes)="showAllNodes()">
        </app-relationship-graph>
        
        <!-- 無資料狀態 -->
        <div *ngIf="!graphData || (graphData.nodes.length === 0)" class="no-data-state">
          <div class="no-data-icon">📊</div>
          <p>請從左側選擇要顯示的節點</p>
        </div>
      </div>
    </section>
  </main>

  <!-- 底部按鈕列 -->
  <footer class="bottom-toolbar" role="toolbar" aria-label="工具列">
    <div class="bottom-left">
      <button class="bottom-btn back-btn" (click)="goBack()">
        返回
      </button>
    </div>
    
    <div class="bottom-right">
      <button class="bottom-btn save-btn" (click)="saveGraph()">
        儲存並退出
      </button>
      <button class="bottom-btn exit-btn" (click)="exitEditor()">
        儲存
      </button>
    </div>
  </footer>
</div>

<!-- 載入中顯示 -->
<div class="loading-container" *ngIf="loading" role="status" aria-live="polite">
  <div class="loading-spinner">載入編輯器中...</div>
</div>
