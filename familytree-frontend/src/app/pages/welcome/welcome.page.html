<div class="welcome-page">

      <h3>關鍵字查詢</h3>
      <p>透過關鍵字搜尋成員資料，支援姓名、身分證、電話等多種搜尋方式</p>
      <a routerLink="/keyword-search" class="feature-link">

    <div class="feature-card">
      <div class="feature-icon">🌳</div>

      </a>
    </div>

    <div class="feature-card">
      <div class="feature-icon">📋</div>
      <h3>資料管理</h3>
      <p>管理成員基本資料，包含個人資訊、關係連結等</p>
      <a routerLink="/search-results" class="feature-link">
        查看資料 →
      </a>
    </div>

    <div class="feature-card">
      <div class="feature-icon">⭐</div>
      <h3>收藏管理</h3>
      <p>收藏重要的成員資料，方便快速查看和管理</p>
      <a routerLink="/favorites" class="feature-link">
        管理收藏 →
      </a>
    </div>
  </div>

    <div class="stat-item">

    </div>
