<!-- 只在非專案管理頁面顯示狀態欄和側邊欄 -->
<app-status-bar *ngIf="!isProjectManagementPage()"></app-status-bar>

<app-sidebar-nav *ngIf="!isProjectManagementPage()" (fullTextSearchClick)="onFullTextSearchClick()"></app-sidebar-nav>

<main class="main" [class.fullscreen]="isProjectManagementPage()">
  <div class="content" [class.fullscreen-content]="isProjectManagementPage()">
    <router-outlet></router-outlet>
  </div>
</main>

<style>
  :host {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
      "Segoe UI Symbol";
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  main {
    width: calc(100vw - max(180px, min(240px, 12vw)));
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 2rem;
    box-sizing: border-box;
    position: relative;
    margin-left: max(180px, min(240px, 12vw));
    transition: margin-left 0.3s ease;
  }

  /* 全畫面模式 */
  main.fullscreen {
    width: 100vw;
    margin-left: 0;
    padding: 0;
    min-height: 100vh;
  }

  .content {
    width: 100%;
    max-width: 1200px;
    box-sizing: border-box;
    word-break: break-word;
    padding: 0 8px;
  }

  .content.fullscreen-content {
    max-width: 100vw;
    width: 100vw;
    padding: 0;
  }

  /* 響應式設計 */
  @media (max-width: 768px) {
    main {
      width: 100vw;
      margin-left: 0;
      padding: 1rem;
      padding-top: 80px; /* 為漢堡選單留出空間 */
    }
    .content {
      max-width: 100vw;
      padding: 0 2px;
    }
  }
</style>
