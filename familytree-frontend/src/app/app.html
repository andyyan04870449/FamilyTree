<!-- Skip Navigation Link for Accessibility -->
<a href="#main-content" class="skip-nav-link">跳至主要內容</a>

<!-- 只在非專案管理頁面和登入頁面顯示狀態欄和側邊欄 -->
<header>
  <app-status-bar *ngIf="!isProjectManagementPage()"></app-status-bar>
</header>

<aside>
  <app-sidebar-nav *ngIf="!isProjectManagementPage()" (fullTextSearchClick)="onFullTextSearchClick()"></app-sidebar-nav>
</aside>

<main class="main" [class.fullscreen]="isProjectManagementPage()" id="main-content">
  <div class="content" [class.fullscreen-content]="isProjectManagementPage()">
    <router-outlet></router-outlet>
  </div>
</main>

<!-- Toast 通知組件 -->
<app-toast></app-toast>

<style>
  :host {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
      "Segoe UI Symbol";
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  main {
    width: calc(100vw - 230px);
    min-height: calc(100vh - 80px);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 2rem;
    box-sizing: border-box;
    position: relative;
    margin-left: 230px;
    margin-top: 80px;
    transition: margin-left 0.3s ease;
  }

  /* 全畫面模式 */
  main.fullscreen {
    width: 100vw;
    margin-left: 0;
    margin-top: 0;
    padding: 0;
    min-height: 100vh;
  }

  .content {
    width: 100%;
    max-width: 1200px;
    box-sizing: border-box;
    word-break: break-word;
    padding: 0 8px;
  }

  .content.fullscreen-content {
    max-width: 100vw;
    width: 100vw;
    padding: 0;
  }

  /* Skip Navigation Link 樣式 */
  .skip-nav-link {
    position: absolute;
    top: -40px;
    left: 0;
    background: #000;
    color: #fff;
    padding: 8px;
    text-decoration: none;
    z-index: 200;
    border-radius: 0 0 4px 0;
  }

  .skip-nav-link:focus {
    top: 0;
  }

  /* 語意化標籤樣式調整 */
  header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
  }

  aside {
    position: fixed;
    left: 0;
    top: 80px;
    height: calc(100vh - 80px);
    z-index: 90;
  }

  /* 響應式設計 */
  @media (max-width: 768px) {
    main {
      width: 100vw;
      margin-left: 0;
      margin-top: 80px;
      padding: 1rem;
    }
    .content {
      max-width: 100vw;
      padding: 0 2px;
    }
    aside {
      position: absolute;
    }
  }
</style>
